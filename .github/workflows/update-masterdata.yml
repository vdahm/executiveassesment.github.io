name: Masterdaten aktualisieren

on:
  push:
    paths:
      - "Volker_CEAIO_Master.xlsx"
      - "scripts/export-master.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-masterdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run build:data -- "Volker_CEAIO_Master.xlsx" "data/ceaio_masterdata.js"

      - name: Aktualisierte Webdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ceaio_masterdata.js
          git diff --cached --quiet || git commit -m "Masterdaten automatisch aktualisiert"
          git push
